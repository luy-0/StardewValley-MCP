name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          # 10.x 是受支持的构建 SDK；6.x Runtime 用于运行与游戏宿主一致的测试。
          dotnet-version: |
            10.0.x
            6.0.x
      - name: 验证 .NET 构建与宿主运行时
        shell: bash
        run: |
          dotnet --version | grep -E '^10\.'
          dotnet --list-runtimes | grep -E '^Microsoft\.NETCore\.App 6\.'
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
      - uses: arduino/setup-protoc@v3
        with:
          version: "34.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 验证公共契约与独立骨架
        shell: bash
        run: ./scripts/verify.sh
