name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          # 10.x 是受支持的构建 SDK；6.x Runtime 用于运行与游戏宿主一致的测试。
          dotnet-version: |
            10.0.x
            6.0.x
      - name: 验证 .NET 构建与宿主运行时
        shell: bash
        run: |
          dotnet --version | grep -E '^10\.'
          dotnet --list-runtimes | grep -E '^Microsoft\.NETCore\.App 6\.'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.32"
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "34.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 验证公共契约与独立骨架
        shell: bash
        run: ./scripts/verify.sh

  mod-package:
    name: Mod Package (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REFERENCE_ASSEMBLIES_COMMIT: 0141355fecb8536715ecff22f99374b5e632cbed

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            10.0.x
            6.0.x
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.32"
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "34.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 检出固定的游戏引用程序集
        shell: bash
        run: |
          reference_path="$RUNNER_TEMP/stardew-reference-assemblies"
          git init "$reference_path"
          git -C "$reference_path" remote add origin \
            https://github.com/StardewModders/mod-reference-assemblies.git
          git -C "$reference_path" fetch --depth=1 origin "$REFERENCE_ASSEMBLIES_COMMIT"
          git -C "$reference_path" checkout --detach FETCH_HEAD
          test "$(git -C "$reference_path" rev-parse HEAD)" = "$REFERENCE_ASSEMBLIES_COMMIT"
          echo "STARDEW_VALLEY_GAME_PATH=$reference_path" >> "$GITHUB_ENV"
      - name: 构建、测试并审计 Mod 发行包
        shell: bash
        run: ./scripts/verify.sh --with-mod
      - name: 上传 Mod ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mod-package-${{ github.sha }}
          path: mod/src/StardewValleyMcp.Mod/bin/Release/net6.0/StardewValleyMCP*.zip
          if-no-files-found: error
          retention-days: 7
