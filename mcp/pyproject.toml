[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "stardew-valley-mcp"
version = "0.1.0a1"
description = "连接本地 Stardew Valley SMAPI Mod 的 MCP 服务端"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "jsonschema>=4.25,<5",
  "mcp>=1.27.2,<2",
  "protobuf>=7.34.1,<8",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.4,<9",
]

[project.scripts]
stardew-valley-mcp = "stardew_valley_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stardew_valley_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
