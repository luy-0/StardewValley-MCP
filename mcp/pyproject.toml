[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "stardew-valley-mcp"
version = "0.1.0a2"
description = "连接本地 Stardew Valley SMAPI Mod 的 MCP 服务端"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "StardewValley-MCP Contributors" },
]
keywords = ["mcp", "smapi", "stardew-valley"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "jsonschema>=4.25,<5",
  "mcp>=1.27.2,<2",
  "protobuf>=7.34.1,<8",
  "PyYAML>=6,<7",
]

[project.urls]
Homepage = "https://github.com/luy-0/StardewValley-MCP"
Repository = "https://github.com/luy-0/StardewValley-MCP"
Issues = "https://github.com/luy-0/StardewValley-MCP/issues"
Documentation = "https://github.com/luy-0/StardewValley-MCP/tree/main/docs"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.4,<9",
]

[project.scripts]
stardew-valley-mcp = "stardew_valley_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stardew_valley_mcp"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
