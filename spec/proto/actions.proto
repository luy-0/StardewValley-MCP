syntax = "proto3";

package stardew_valley.mcp.v1;

option csharp_namespace = "StardewValleyMcp.Protocol.V1";

import "common.proto";
import "facts.proto";
import "refs.proto";

message SayRequest {
  // UTF-8 文本；规范限制为 1..500 个 Unicode Scalar Value。
  string content = 1;
}

message SayResult {
  uint32 content_length = 1;
}

enum EmoteKind {
  EMOTE_KIND_UNSPECIFIED = 0;
  EMOTE_KIND_HAPPY = 1;
  EMOTE_KIND_SAD = 2;
  EMOTE_KIND_HEART = 3;
  EMOTE_KIND_EXCLAMATION = 4;
  EMOTE_KIND_QUESTION = 5;
  EMOTE_KIND_ANGRY = 6;
  EMOTE_KIND_SLEEP = 7;
  EMOTE_KIND_MUSIC = 8;
  EMOTE_KIND_NOTE = 9;
  EMOTE_KIND_GAME = 10;
  EMOTE_KIND_X = 11;
  EMOTE_KIND_PAUSE = 12;
  EMOTE_KIND_BLUSH = 13;
  EMOTE_KIND_YES = 14;
  EMOTE_KIND_NO = 15;
  EMOTE_KIND_SICK = 16;
  EMOTE_KIND_LAUGH = 17;
  EMOTE_KIND_SURPRISED = 18;
  EMOTE_KIND_HI = 19;
  EMOTE_KIND_TAUNT = 20;
  EMOTE_KIND_UH = 21;
  EMOTE_KIND_JAR = 22;
}

message EmoteRequest {
  EmoteKind emote = 1;
}

message EmoteResult {
  EmoteKind emote = 1;
}

message FaceRequest {
  Direction direction = 1;
}

message FaceResult {
  Direction final_direction = 1;
  bool changed = 2;
}

enum ArrivalMode {
  ARRIVAL_MODE_UNSPECIFIED = 0;
  ARRIVAL_MODE_EXACT = 1;
  ARRIVAL_MODE_ADJACENT = 2;
}

message NavigateRequest {
  oneof target {
    WorldPosition position = 1;
    Ref target_ref = 2;
  }
  ArrivalMode arrival = 3;
  optional Direction stand_side = 4;
  optional Direction face_on_arrival = 5;
}

message NavigateResult {
  WorldPosition start = 1;
  WorldPosition final = 2;
  WorldPosition resolved_destination = 3;
  repeated string route_location_ids = 4;
  reserved 5;
  ExecutionStats execution = 6;
}

message InteractRequest {
  oneof target {
    WorldPosition position = 1;
    Ref target_ref = 2;
  }
}

message InteractResult {
  WorldPosition target = 1;
  reserved 2;
  ResourceChange energy = 3;
  ExecutionStats execution = 4;
}

message UseToolRequest {
  oneof target {
    WorldPosition position = 1;
    Ref target_ref = 2;
  }
  // 0 表示不蓄力；有效上限由当前工具决定。
  uint32 charge_level = 3;
}

message UseToolResult {
  WorldPosition target = 1;
  string tool_qualified_item_id = 2;
  uint32 charge_level = 3;
  reserved 4;
  ResourceChange energy = 5;
  ExecutionStats execution = 6;
}

message EquipRequest {
  oneof selector {
    // 从 0 开始；调用方应优先使用 query_inventory 返回的 Item Ref。
    uint32 slot_index = 1;
    Ref item_ref = 2;
  }
  // 提供时必须与产生 item_ref 的 Inventory Revision 一致。
  optional string inventory_revision = 3;
}

message EquipResult {
  uint32 slot_index = 1;
  ItemFact item = 2;
  bool changed = 3;
}

enum InventoryTransferDirection {
  INVENTORY_TRANSFER_DIRECTION_UNSPECIFIED = 0;
  INVENTORY_TRANSFER_DIRECTION_PLAYER_TO_CONTAINER = 1;
  INVENTORY_TRANSFER_DIRECTION_CONTAINER_TO_PLAYER = 2;
}

message TransferInventoryItemRequest {
  InventoryTransferDirection direction = 1;
  Ref item_ref = 2;
  uint32 quantity = 3;
  string ui_revision = 4;
  string player_inventory_revision = 5;
  string container_inventory_revision = 6;
}

message TransferInventoryItemResult {
  uint32 transferred_quantity = 1;
  uint32 source_slot_index = 2;
  uint32 source_remaining_quantity = 3;
  string player_inventory_revision = 4;
  string container_inventory_revision = 5;
}

message SetEquipmentSlotRequest {
  Ref equipment_slot_ref = 1;
  oneof value {
    Ref item_ref = 2;
    bool clear = 3;
  }
  string ui_revision = 4;
  string player_inventory_revision = 5;
}

message SetEquipmentSlotResult {
  UiEquipmentSlotKind equipment_slot_kind = 1;
  uint32 equipment_slot_index = 2;
  // 清空后缺省；装备槽中的 ItemFact 不签发物品 Ref。
  optional ItemFact item = 3;
  string player_inventory_revision = 4;
  bool changed = 5;
}

message MoveInventoryItemRequest {
  Ref item_ref = 1;
  Ref destination_slot_ref = 2;
  string ui_revision = 3;
  string player_inventory_revision = 4;
}

message MoveInventoryItemResult {
  uint32 source_slot_index = 1;
  uint32 destination_slot_index = 2;
  bool changed = 3;
  bool swapped = 4;
  string player_inventory_revision = 5;
}

enum CraftItemStopReason {
  CRAFT_ITEM_STOP_REASON_UNSPECIFIED = 0;
  CRAFT_ITEM_STOP_REASON_COMPLETED = 1;
  CRAFT_ITEM_STOP_REASON_MATERIALS_INSUFFICIENT = 2;
  CRAFT_ITEM_STOP_REASON_INVENTORY_FULL = 3;
}

message CraftingMaterialConsumption {
  string ingredient_key = 1;
  uint32 quantity = 2;
}

message CraftItemRequest {
  Ref recipe_ref = 1;
  // 制作轮数；一轮可能产出多件物品。
  uint32 craft_count = 2;
  string ui_revision = 3;
}

message CraftItemResult {
  uint32 requested_craft_count = 1;
  uint32 completed_craft_count = 2;
  CraftItemStopReason stop_reason = 3;
  repeated CraftingOutputFact outputs = 4;
  repeated CraftingMaterialConsumption materials_consumed = 5;
  string player_inventory_revision = 6;
  string ui_revision = 7;
}

message PurchaseShopItemRequest {
  Ref sale_ref = 1;
  // 购买轮数；一轮可能包含多件同类物品。
  uint32 purchase_count = 2;
  string ui_revision = 3;
}

message PurchaseShopItemResult {
  uint32 purchase_count = 1;
  // 实际收入背包的物品，不签发新的物品 Ref。
  ItemFact item = 2;
  uint32 total_price = 3;
  uint32 money_before = 4;
  uint32 money_after = 5;
  // 无限库存商品缺省。
  optional uint32 stock_remaining = 6;
  string player_inventory_revision = 7;
  string ui_revision = 8;
}

message OpenMenuRequest {
  MenuKind menu = 1;
}

message OpenMenuResult {
  MenuTransition transition = 1;
}

message ActivateUiRequest {
  Ref element_ref = 1;
  // 必须等于 query_ui 返回该 Ref 时的 Revision。
  string ui_revision = 2;
}

message ActivateUiResult {
  Ref element_ref = 1;
  MenuTransition transition = 2;
  reserved 3;
}

message CloseMenuRequest {}

message CloseMenuResult {
  MenuTransition transition = 1;
  bool already_closed = 2;
}
