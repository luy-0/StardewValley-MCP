syntax = "proto3";

package stardew_valley.mcp.v1;

option csharp_namespace = "StardewValleyMcp.Protocol.V1";

import "common.proto";
import "refs.proto";

message RuntimeSnapshot {
  GameDate date = 1;
  uint32 time_of_day = 2;
  PlayerFact player = 3;
  WeatherFact weather = 4;
  UiSummary ui = 5;
  DailyLuckFact daily_luck = 6;
  TvCookingRecipeFact queen_of_sauce = 7;
}

message PlayerFact {
  WorldPosition position = 1;
  Direction facing = 2;
  int64 money = 3;
  double energy = 4;
  double max_energy = 5;
  int32 health = 6;
  int32 max_health = 7;
  bool can_move = 8;
  // 当前玩家住宅的精确地图标识；多人小屋使用 NameOrUniqueName，避免同名室内冲突。
  string home_location_id = 9;
}

message PlayersSnapshot {
  repeated PlayerPresenceFact players = 1;
}

enum PlayerRelation {
  PLAYER_RELATION_UNSPECIFIED = 0;
  PLAYER_RELATION_MYSELF = 1;
  PLAYER_RELATION_OTHER = 2;
}

message PlayerPresenceFact {
  // Farmer.UniqueMultiplayerID 的有符号十进制表示；调用方必须视为不透明身份。
  string player_id = 1;
  // 存档内角色名，不是 Steam 等平台账号名。
  string display_name = 2;
  PlayerRelation relation = 3;
  bool online = 4;
  bool is_host = 5;

  // 以下实时字段只对在线玩家出现；离线玩家不得返回断线前的陈旧值。
  optional WorldPosition position = 6;
  optional Direction facing = 7;
  optional double energy = 8;
  optional double max_energy = 9;
  optional bool is_in_bed = 10;

  // 能确认时返回住宅的 NameOrUniqueName；多人 Cabin 不得退化为短名。
  optional string home_location_id = 11;
}

message WeatherFact {
  bool raining = 1;
  bool lightning = 2;
  bool snowing = 3;
  bool green_rain = 4;
  bool festival_day = 5;
  WeatherKind kind = 6;
  WeatherKind tomorrow = 7;
}

message UiSummary {
  bool menu_open = 1;
  string menu_type = 2;
}

message DailyLuckFact {
  double value = 1;
  DailyLuckTier tier = 2;
}

message TvCookingRecipeFact {
  bool available = 1;
  bool rerun = 2;
  string recipe_key = 3;
  string display_name = 4;
  bool already_known = 5;
  bool learnable = 6;
}

enum WeatherKind {
  WEATHER_KIND_UNSPECIFIED = 0;
  WEATHER_KIND_SUN = 1;
  WEATHER_KIND_RAIN = 2;
  WEATHER_KIND_STORM = 3;
  WEATHER_KIND_SNOW = 4;
  WEATHER_KIND_WIND = 5;
  WEATHER_KIND_GREEN_RAIN = 6;
  WEATHER_KIND_FESTIVAL = 7;
  WEATHER_KIND_WEDDING = 8;
}

enum DailyLuckTier {
  DAILY_LUCK_TIER_UNSPECIFIED = 0;
  DAILY_LUCK_TIER_VERY_UNLUCKY = 1;
  DAILY_LUCK_TIER_UNLUCKY = 2;
  DAILY_LUCK_TIER_NEUTRAL = 3;
  DAILY_LUCK_TIER_LUCKY = 4;
  DAILY_LUCK_TIER_VERY_LUCKY = 5;
}

enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_TREE = 1;
  ENTITY_KIND_FRUIT_TREE = 2;
  ENTITY_KIND_CROP = 3;
  ENTITY_KIND_RESOURCE_NODE = 4;
  ENTITY_KIND_RESOURCE_CLUMP = 5;
  ENTITY_KIND_MACHINE = 6;
  ENTITY_KIND_CONTAINER = 7;
  ENTITY_KIND_BED = 8;
  ENTITY_KIND_FURNITURE = 9;
  ENTITY_KIND_LOOSE_ITEM = 10;
  ENTITY_KIND_DOOR = 11;
  ENTITY_KIND_WARP = 12;
  ENTITY_KIND_GENERIC_OBJECT = 13;
  ENTITY_KIND_HOE_DIRT = 14;
}

message WorldSnapshot {
  string world_revision = 1;
  TileArea area = 2;
  bool outdoors = 3;
  repeated TileFact tiles = 4;
  repeated WorldEntityFact entities = 5;
  repeated CharacterFact characters = 6;
  bool entities_truncated = 7;
  bool characters_truncated = 8;
}

message TileFact {
  WorldPosition position = 1;
  bool passable = 2;
  bool occupied = 3;
  bool diggable = 4;
  bool water = 5;
  string terrain_kind = 6;
  // 当前玩家能否在该格通过喷壶原生动作补水；以游戏公开判定为权威。
  optional bool watering_can_refillable = 7;
  // 当前玩家使用原生 PathFindController 时，该格是否会被碰撞判定阻挡。
  optional bool pathfinding_blocked = 8;
}

message WorldEntityFact {
  Ref ref = 1;
  EntityKind kind = 2;
  WorldPosition position = 3;
  string display_name = 4;
  // 字段存在时表示该实体对创建 Snapshot 的当前玩家是否可操作；缺省表示未知。
  optional bool actionable = 5;

  oneof details {
    TreeFact tree = 20;
    FruitTreeFact fruit_tree = 21;
    CropFact crop = 22;
    ResourceNodeFact resource_node = 23;
    ResourceClumpFact resource_clump = 24;
    MachineFact machine = 25;
    ContainerFact container = 26;
    BedFact bed = 27;
    FurnitureFact furniture = 28;
    LooseItemFact loose_item = 29;
    DoorFact door = 30;
    WarpFact warp = 31;
    GenericObjectFact generic_object = 32;
    HoeDirtFact hoe_dirt = 33;
  }
}

message TreeFact {
  uint32 growth_stage = 1;
  bool stump = 2;
  bool tapped = 3;
  bool mossy = 4;
  double health = 5;
}

message FruitTreeFact {
  string fruit_item_id = 1;
  uint32 growth_stage = 2;
  uint32 days_until_mature = 3;
  uint32 fruit_count = 4;
  bool stump = 5;
}

enum CropHarvestAction {
  CROP_HARVEST_ACTION_UNSPECIFIED = 0;
  CROP_HARVEST_ACTION_INTERACT = 1;
  CROP_HARVEST_ACTION_SCYTHE = 2;
}

message CropFact {
  string crop_id = 1;
  string harvest_item_id = 2;
  uint32 growth_phase = 3;
  bool ready_for_harvest = 4;
  bool watered = 5;
  bool dead = 6;
  bool regrows = 7;
  CropHarvestAction harvest_action = 8;
  // 字段存在且为 true 时，该耕地当前施有肥料；缺失不得解释为“无肥料”。
  optional bool has_fertilizer = 9;
  // 当前肥料的 Qualified Item ID；仅在能安全确认肥料存在并解析其 ID 时出现。
  optional string fertilizer_item_id = 10;
  // 当前生长阶段内已经完成的浇水生长日；成熟或再生倒计时期间可以缺失。
  optional uint32 growth_phase_day = 11;
  // 当前生长阶段需要的浇水生长日；成熟或无法安全读取时可以缺失。
  optional uint32 growth_phase_duration = 12;
  // 生长阶段总数，包含最终成熟阶段。
  optional uint32 growth_phase_count = 13;
  // 假设之后每个需要浇水的生长日都满足条件，距离首次成熟还需的生长日。
  optional uint32 growth_days_remaining_if_watered = 14;
  // 每次收获后重新产出的基础间隔；不再生的作物保持缺失。
  optional uint32 regrow_days = 15;
  // 成熟再生作物距离下一次可收获还需的生长日；首次生长期间保持缺失。
  optional uint32 regrow_days_remaining = 16;
  // 活着且已经到达最终生长阶段；再生倒计时期间仍为 true。
  optional bool mature = 17;
  // 当前作物是否需要浇水才能继续推进生长。
  optional bool needs_watering = 18;
}

// 不含作物的已耕地事实。带作物的 HoeDirt 继续使用 CropFact。
message HoeDirtFact {
  bool watered = 1;
}

message ResourceNodeFact {
  string node_kind = 1;
  uint32 hits_to_destroy = 2;
  string required_tool = 3;
}

message ResourceClumpFact {
  string clump_kind = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 health = 4;
  string required_tool = 5;
  uint32 required_tool_level = 6;
}

enum ItemToolKind {
  ITEM_TOOL_KIND_UNSPECIFIED = 0;
  ITEM_TOOL_KIND_AXE = 1;
  ITEM_TOOL_KIND_PICKAXE = 2;
  ITEM_TOOL_KIND_HOE = 3;
  ITEM_TOOL_KIND_WATERING_CAN = 4;
  ITEM_TOOL_KIND_SCYTHE = 5;
}

message ItemFact {
  // QueryInventory 返回的非空 Slot Item 携带可用于 inspect 的 INVENTORY_ITEM Ref；
  // 是否可用于具体动作由能力行为契约决定。
  optional Ref ref = 1;
  string qualified_item_id = 2;
  string display_name = 3;
  uint32 stack = 4;
  uint32 quality = 5;
  // Item.Category 使用 invariant culture 格式化得到的十进制整数字符串，不是本地化分类名称。
  string category = 6;
  bool tool = 7;
  uint32 tool_level = 8;
  // 仅喷壶携带下列字段；其他物品保持缺省，避免把 0 误解为“空喷壶”。
  optional uint32 water_remaining = 9;
  optional uint32 water_capacity = 10;
  optional bool bottomless = 11;
  // 仅公开 use_tool 支持且能稳定分类的工具；其他 Tool 保持缺省。
  optional ItemToolKind tool_kind = 12;
}

enum MachineState {
  MACHINE_STATE_UNSPECIFIED = 0;
  MACHINE_STATE_UNKNOWN = 1;
  MACHINE_STATE_IDLE = 2;
  MACHINE_STATE_PROCESSING = 3;
  MACHINE_STATE_READY = 4;
}

message MachineFact {
  string qualified_item_id = 1;
  bool ready_for_harvest = 2;
  int32 minutes_until_ready = 3;
  // 当前预测输出或处理中间产物；最终收取结果仍以游戏原生收取行为为准。
  optional ItemFact held_item = 4;
  // 仅在运行态可安全读取时出现；特殊或不一致状态显式使用 UNKNOWN。
  optional MachineState state = 5;
  // 游戏保留且能安全读取时返回最近一次投入的物品事实。
  optional ItemFact input_item = 6;
}

message ContainerFact {
  string container_kind = 1;
  uint32 capacity = 2;
  uint32 item_count = 3;
}

message BedFact {
  bool can_sleep = 1;
  repeated WorldPosition occupied_tiles = 2;
  // 玩家应到达的睡眠触发格，不等同于家具占用格集合。
  WorldPosition sleep_position = 3;
}

enum FurnitureInteractionKind {
  FURNITURE_INTERACTION_KIND_UNSPECIFIED = 0;
  FURNITURE_INTERACTION_KIND_SEAT = 1;
  FURNITURE_INTERACTION_KIND_SURFACE = 2;
  FURNITURE_INTERACTION_KIND_STORAGE = 3;
  FURNITURE_INTERACTION_KIND_TOGGLE = 4;
}

message FurnitureFact {
  string furniture_kind = 1;
  uint32 rotation = 2;
  repeated WorldPosition occupied_tiles = 3;
  optional string qualified_item_id = 4;
  optional uint32 rotation_count = 5;
  optional bool can_rotate = 6;
  optional uint32 seat_capacity = 7;
  optional uint32 occupied_seats = 8;
  optional bool has_surface_item = 9;
  optional ItemFact surface_item = 10;
  optional bool is_on = 11;
  // 保守公开且可由语言无关事实确认的交互能力集合。
  repeated FurnitureInteractionKind interaction_kinds = 12;
  // true 表示本轮已完整判断交互能力，此时空集合才表示普通装饰家具。
  optional bool interaction_profile_complete = 13;
  // STORAGE 家具当前可安全确认的非空物品数量。
  optional uint32 storage_item_count = 14;
}

message LooseItemFact {
  ItemFact item = 1;
  bool can_pick_up = 2;
}

message DoorFact {
  optional bool locked = 1;
  string target_location_id = 2;
  optional TilePoint target_tile = 3;
}

message WarpFact {
  WorldPosition destination = 1;
  bool npc_only = 2;
}

message GenericObjectFact {
  string runtime_type = 1;
  string qualified_item_id = 2;
}

enum CharacterKind {
  CHARACTER_KIND_UNSPECIFIED = 0;
  CHARACTER_KIND_NPC = 1;
  CHARACTER_KIND_MONSTER = 2;
  CHARACTER_KIND_FARM_ANIMAL = 3;
  CHARACTER_KIND_PET = 4;
  CHARACTER_KIND_HORSE = 5;
}

message CharacterFact {
  Ref ref = 1;
  CharacterKind kind = 2;
  string name = 3;
  string display_name = 4;
  WorldPosition position = 5;
  Direction facing = 6;

  oneof details {
    NpcFact npc = 20;
    MonsterFact monster = 21;
    FarmAnimalFact farm_animal = 22;
    PetFact pet = 23;
    HorseFact horse = 24;
  }
}

message NpcFact {
  bool can_socialize = 1;
  int32 friendship_points = 2;
  bool has_dialogue = 3;
}

message MonsterFact {
  int32 health = 1;
  int32 max_health = 2;
  int32 contact_damage = 3;
}

enum FarmAnimalProduceHarvestMethod {
  FARM_ANIMAL_PRODUCE_HARVEST_METHOD_UNSPECIFIED = 0;
  FARM_ANIMAL_PRODUCE_HARVEST_METHOD_DROP_OVERNIGHT = 1;
  FARM_ANIMAL_PRODUCE_HARVEST_METHOD_HARVEST_WITH_TOOL = 2;
  FARM_ANIMAL_PRODUCE_HARVEST_METHOD_DIG_UP = 3;
}

message FarmAnimalFact {
  string animal_type = 1;
  bool produce_ready = 2;
  bool petted_today = 3;
  int32 friendship = 4;
  int32 happiness = 5;
  optional uint32 fullness = 6;
  // 当且仅当 fullness >= 200 时为 true。
  optional bool fed_today = 7;
  optional bool auto_petted_today = 8;
  // 仅表示动物身上当前可收取的产物，不包含已经落到地面的隔夜产物。
  optional string produce_item_id = 9;
  optional uint32 produce_quality = 10;
  optional FarmAnimalProduceHarvestMethod produce_harvest_method = 11;
  optional uint32 age_days = 12;
  optional bool adult = 13;
  optional uint32 days_until_mature = 14;
  optional uint32 days_since_last_produce = 15;
  optional uint32 base_days_to_produce = 16;
  optional bool has_home_building = 17;
  // 所属建筑实例的规范 UUID 字符串，不是建筑类型或显示名称。
  optional string home_building_id = 18;
  optional string home_building_type = 19;
  optional bool in_home_building = 20;
}

message PetFact {
  string pet_type = 1;
  bool petted_today = 2;
  int32 friendship = 3;
}

message HorseFact {
  bool has_rider = 1;
}

message InventorySnapshot {
  string inventory_revision = 1;
  string container_kind = 2;
  optional Ref container_ref = 3;
  uint32 slot_count = 4;
  repeated InventorySlot slots = 5;
}

message InventorySlot {
  // 从 0 开始；与 Stardew Valley 的实际背包索引一致。
  uint32 index = 1;
  optional ItemFact item = 2;
}

enum UiElementKind {
  UI_ELEMENT_KIND_UNSPECIFIED = 0;
  UI_ELEMENT_KIND_BUTTON = 1;
  UI_ELEMENT_KIND_TAB = 2;
  UI_ELEMENT_KIND_OPTION = 3;
  UI_ELEMENT_KIND_ITEM_SLOT = 4;
  UI_ELEMENT_KIND_DIALOGUE_RESPONSE = 5;
  UI_ELEMENT_KIND_DIALOGUE_ADVANCE = 6;
  UI_ELEMENT_KIND_EQUIPMENT_SLOT = 7;
  UI_ELEMENT_KIND_CRAFTING_RECIPE = 8;
}

enum UiDialogueKind {
  UI_DIALOGUE_KIND_UNSPECIFIED = 0;
  UI_DIALOGUE_KIND_SLEEP_CONFIRMATION = 1;
}

enum UiInventorySide {
  UI_INVENTORY_SIDE_UNSPECIFIED = 0;
  UI_INVENTORY_SIDE_PLAYER = 1;
  UI_INVENTORY_SIDE_CONTAINER = 2;
}

enum UiEquipmentSlotKind {
  UI_EQUIPMENT_SLOT_KIND_UNSPECIFIED = 0;
  UI_EQUIPMENT_SLOT_KIND_HAT = 1;
  UI_EQUIPMENT_SLOT_KIND_LEFT_RING = 2;
  UI_EQUIPMENT_SLOT_KIND_RIGHT_RING = 3;
  UI_EQUIPMENT_SLOT_KIND_BOOTS = 4;
  UI_EQUIPMENT_SLOT_KIND_SHIRT = 5;
  UI_EQUIPMENT_SLOT_KIND_PANTS = 6;
  UI_EQUIPMENT_SLOT_KIND_TRINKET = 7;
}

message CraftingMaterialRequirement {
  // 原版配方中的物品 ID、类别编号或特殊匹配键。
  string ingredient_key = 1;
  string display_name = 2;
  uint32 required_quantity = 3;
  // 包括玩家背包和当前 Crafting 页指定的材料容器。
  uint32 available_quantity = 4;
}

message CraftingOutputFact {
  string qualified_item_id = 1;
  string display_name = 2;
  uint32 quantity = 3;
}

message CraftingRecipeFact {
  string recipe_key = 1;
  string display_name = 2;
  bool known = 3;
  // 只表示当前材料足够，不表示已验证制作提交或背包容量。
  bool craftable = 4;
  repeated CraftingMaterialRequirement materials = 5;
  // 多个元素表示原版制作时可能随机选择其一。
  repeated CraftingOutputFact possible_outputs = 6;
}

message UiInventoryLink {
  // ItemGrabMenu 中的库存一侧；不得用 Slot Index 偏移代替。
  UiInventorySide side = 1;
  // 与同一时刻 query_inventory 返回值完全一致。
  string inventory_revision = 2;
  uint32 slot_count = 3;
  // 仅容器侧存在；玩家侧必须缺省。
  optional Ref container_ref = 4;
}

message UiSnapshot {
  string ui_revision = 1;
  bool menu_open = 2;
  optional UiMenuFact menu = 3;
  repeated UiElementFact elements = 4;
  repeated UiInventoryLink inventories = 5;
}

message UiMenuFact {
  string menu_type = 1;
  optional MenuKind menu_kind = 2;
  string title = 3;
  bool modal = 4;
  string dialogue_text = 5;
  // 只对实现能够从游戏稳定语义键确认的问题出现；不得从本地化文案猜测。
  optional UiDialogueKind dialogue_kind = 6;
}

message UiElementFact {
  Ref ref = 1;
  UiElementKind kind = 2;
  string label = 3;
  bool visible = 4;
  bool enabled = 5;
  PixelPoint center = 6;
  uint32 index = 7;
  optional ItemFact item = 8;
  optional int64 price = 9;
  optional uint32 stock = 10;
  // 仅库存槽位存在；Shop Item Slot 必须缺省。
  optional UiInventorySide inventory_side = 11;
  // 库存槽位非空时存在；完整 ItemFact 由 query_inventory 或 inspect 返回。
  optional Ref item_ref = 12;
  // 仅 Inventory 页装备槽存在；index 是同种类内从 0 开始的序号。
  optional UiEquipmentSlotKind equipment_slot_kind = 13;
  // 仅精确原版 Crafting 页的 CRAFTING_RECIPE 元素存在。
  optional CraftingRecipeFact crafting_recipe = 14;
}
