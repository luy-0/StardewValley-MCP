schema_version: 1
package: stardew_valley.mcp.v1
tool_name_prefix: stardew_

# Error 的可选结构化上下文从公共 Proto 生成。它们只能补充错误，不能替代
# ErrorCode、Message 或命令终态；未声明的 Error 字段不得投影到 Tool JSON。
error_contexts:
  navigate:
    navigation:
      message: NavigationFailureContext

# Proto 负责字段、类型、编号、oneof 与嵌套结构；本文件显式定义 Proto 无法表达的
# MCP JSON 投影策略。未列出的请求消息保持封闭空对象或只使用通用约束。
messages:
  SayRequest:
    required: [content]
    fields:
      content: {minLength: 1, maxLength: 500}

  EmoteRequest:
    required: [emote]

  FaceRequest:
    required: [direction]

  NavigateRequest:
    required: [arrival]
    required_oneofs: [target]
    allOf:
      - if: {required: [targetRef]}
        then:
          properties:
            arrival: {const: adjacent}
      - if: {required: [standSide]}
        then:
          properties:
            arrival: {const: adjacent}

  InteractRequest:
    required_oneofs: [target]

  UseToolRequest:
    required_oneofs: [target]
    fields:
      chargeLevel: {minimum: 0, maximum: 5, default: 0}

  EquipRequest:
    required_oneofs: [selector]
    allOf:
      - if: {required: [itemRef]}
        then: {required: [inventoryRevision]}

  TransferInventoryItemRequest:
    required: [direction, itemRef, quantity, uiRevision, playerInventoryRevision, containerInventoryRevision]
    fields:
      quantity: {minimum: 1, maximum: 2147483647}

  SetEquipmentSlotRequest:
    required: [equipmentSlotRef, uiRevision, playerInventoryRevision]
    required_oneofs: [value]
    fields:
      clear: {const: true}

  MoveInventoryItemRequest:
    required: [itemRef, destinationSlotRef, uiRevision, playerInventoryRevision]

  CraftItemRequest:
    required: [recipeRef, craftCount, uiRevision]
    fields:
      craftCount: {minimum: 1, maximum: 25}

  PurchaseShopItemRequest:
    required: [saleRef, purchaseCount, uiRevision]
    fields:
      purchaseCount: {minimum: 1, maximum: 25}

  OpenMenuRequest:
    required: [menu]

  ActivateUiRequest:
    required: [elementRef, uiRevision]

  QueryWorldRequest:
    fields:
      entityKinds: {default: []}
      includeTiles: {default: true}
      includeEntities: {default: true}
      includeCharacters: {default: true}
      # 省略时线路零值由 Mod 解释为 256；Schema 展示的是调用方可见的有效默认值。
      maxEntities: {minimum: 0, maximum: 512, default: 256}
      maxCharacters: {minimum: 0, maximum: 512, default: 256}
    allOf:
      - if:
          required: [includeEntities]
          properties:
            includeEntities: {const: false}
        then:
          properties:
            entityKinds: {maxItems: 0}

  QueryInventoryRequest:
    fields:
      includeEmptySlots: {default: false}

  InspectRequest:
    required: [refs]
    fields:
      refs: {minItems: 1, maxItems: 64, uniqueItems: true}

  Ref:
    required: [value]
    fields:
      value: {minLength: 1, maxLength: 512}

  WorldPosition:
    required: [locationId, x, y]

  TileArea:
    required: [locationId, x, y, width, height]
    fields:
      width: {minimum: 1, maximum: 32}
      height: {minimum: 1, maximum: 32}

  RadiusArea:
    required: [center, radius]
    fields:
      radius: {minimum: 0, maximum: 15}

  PlayerInventorySelector: {}

# 成功结果中可由 JSON Schema 静态证明的约束。与实时游戏状态相关的动态
# 后置条件仍由 capabilities/behavior.md 和实现期 Conformance Harness 验证。
output_messages:
  Ref:
    fields:
      value: {minLength: 1, maxLength: 512}

  PlayersSnapshot:
    fields:
      players: {minItems: 1}

  PlayerPresenceFact:
    fields:
      playerId:
        minLength: 1
        maxLength: 20
        pattern: "^-?(0|[1-9][0-9]*)$"
      relation:
        enum: [myself, other]
    allOf:
      - if:
          required: [online]
          properties:
            online: {const: false}
        then:
          not:
            anyOf:
              - {required: [position]}
              - {required: [facing]}
              - {required: [energy]}
              - {required: [maxEnergy]}
              - {required: [isInBed]}
      - if: {required: [energy]}
        then: {required: [maxEnergy]}
      - if: {required: [maxEnergy]}
        then: {required: [energy]}

  SayResult:
    fields:
      contentLength: {minimum: 1, maximum: 500}

  EmoteResult:
    fields:
      emote:
        enum: [happy, sad, heart, exclamation, question, angry, sleep, music, note, game, x, pause, blush, "yes", "no", sick, laugh, surprised, hi, taunt, uh, jar]

  FaceResult:
    fields:
      finalDirection:
        enum: [up, right, down, left]

  UseToolResult:
    fields:
      chargeLevel: {minimum: 0, maximum: 5}

  TransferInventoryItemResult:
    fields:
      transferredQuantity: {minimum: 1, maximum: 2147483647}
      sourceRemainingQuantity: {minimum: 0, maximum: 2147483647}

  CraftItemResult:
    fields:
      requestedCraftCount: {minimum: 1, maximum: 25}
      completedCraftCount: {minimum: 1, maximum: 25}
      outputs: {minItems: 1}
      materialsConsumed: {minItems: 1}
      stopReason:
        enum: [completed, materials_insufficient, inventory_full]

  CraftingMaterialConsumption:
    fields:
      quantity: {minimum: 1}

  PurchaseShopItemResult:
    fields:
      purchaseCount: {minimum: 1, maximum: 25}

  InspectedRef:
    allOf:
      - oneOf:
          - properties:
              resolution:
                properties: {status: {const: resolved}, kind: {const: world_entity}}
                required: [status, kind]
                not: {required: [error]}
            required: [resolution, worldEntity]
          - properties:
              resolution:
                properties: {status: {const: resolved}, kind: {const: character}}
                required: [status, kind]
                not: {required: [error]}
            required: [resolution, character]
          - properties:
              resolution:
                properties: {status: {const: resolved}, kind: {const: inventory_item}}
                required: [status, kind]
                not: {required: [error]}
            required: [resolution, inventoryItem]
          - properties:
              resolution:
                properties: {status: {const: resolved}, kind: {const: container}}
                required: [status, kind]
                not: {required: [error]}
            required: [resolution, inventory]
          - properties:
              resolution:
                properties: {status: {const: resolved}, kind: {const: ui_element}}
                required: [status, kind]
                not: {required: [error]}
            required: [resolution, uiElement]
          - properties:
              resolution:
                properties:
                  status: {const: stale}
                  error:
                    properties: {code: {const: stale_ref}}
                    required: [code]
                required: [status, error]
            required: [resolution]
            not: {anyOf: [{required: [worldEntity]}, {required: [character]}, {required: [inventoryItem]}, {required: [inventory]}, {required: [uiElement]}]}
          - properties:
              resolution:
                properties:
                  status: {const: not_found}
                  error:
                    properties: {code: {const: not_found}}
                    required: [code]
                required: [status, error]
            required: [resolution]
            not: {anyOf: [{required: [worldEntity]}, {required: [character]}, {required: [inventoryItem]}, {required: [inventory]}, {required: [uiElement]}]}
          - properties:
              resolution:
                properties:
                  status: {const: unsupported}
                  error:
                    properties: {code: {const: invalid_argument}}
                    required: [code]
                required: [status, error]
            required: [resolution]
            not: {anyOf: [{required: [worldEntity]}, {required: [character]}, {required: [inventoryItem]}, {required: [inventory]}, {required: [uiElement]}]}
          - properties:
              resolution:
                properties:
                  status: {const: fact_unavailable}
                  kind: {enum: [world_entity, character, inventory_item, container, ui_element]}
                  error:
                    properties:
                      code: {const: internal}
                      message: {const: 当前 Ref 事实不可用}
                    required: [code, message]
                required: [status, kind, error]
            required: [resolution]
            not: {anyOf: [{required: [worldEntity]}, {required: [character]}, {required: [inventoryItem]}, {required: [inventory]}, {required: [uiElement]}]}
