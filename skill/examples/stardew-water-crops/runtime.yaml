schemaVersion: "1"
entrypoint: scripts/run.py:run

tool:
  name: stardew_skill_water_crops
  title: 有界浇灌指定范围作物
  description: 在一次调用中查询指定范围，安全规划站位与蓄力，逐项浇水并复查含水事实。
  inputSchema: schemas/input.json
  outputSchema: schemas/output.json
  annotations:
    readOnlyHint: false
    destructiveHint: true
    idempotentHint: false
    openWorldHint: false

requires:
  tools:
    - stardew_query_runtime
    - stardew_query_inventory
    - stardew_query_world
    - stardew_inspect
    - stardew_navigate
    - stardew_equip
    - stardew_use_tool

execution:
  timeoutSeconds: 905
  concurrency: exclusive
